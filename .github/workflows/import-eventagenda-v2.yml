name: EventAgenda Version 2 importieren
on:
  push:
    paths: [".github/workflows/import-eventagenda-v2.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quellcode herunterladen und prüfen
        run: |
          curl --fail --location --retry 3 --silent --show-error             'https://media.base44.com/files/public/690467d02b52a70318eb550e/6ee4ec1ac_EventAgenda-Version2-Quellcode.zip'             -o /tmp/eventagenda-v2.zip
          test "$(wc -c </tmp/eventagenda-v2.zip)" -gt 10000
          unzip -t /tmp/eventagenda-v2.zip
      - name: EventAgenda aktualisieren
        run: |
          unzip -o /tmp/eventagenda-v2.zip -d .
          node --check public/app.js
          node --check src/worker.js
          node --check src/_lib.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md public src functions schema.sql .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "Restore organizer dashboard and password invitations [skip ci]"
            git push
          fi
